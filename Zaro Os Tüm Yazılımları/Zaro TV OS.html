<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaroTV OS - Smart TV Edition v8.0 (Final)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; overflow: hidden; background: #09090b; }
        .tv-frame {
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.9), 0 0 40px rgba(59, 130, 246, 0.15);
            background: #18181b;
            border: 10px solid #27272a;
            border-radius: 20px;
        }
        .tv-screen {
            background: #000;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            transition: filter 0.3s, background 0.3s;
        }
        .remote-controller {
            background: linear-gradient(135deg, #27272a 0%, #09090b 100%);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8);
            border: 2px solid #3f3f46;
        }
        .remote-btn {
            background: #3f3f46;
            transition: transform 0.05s, background 0.1s;
            cursor: pointer;
        }
        .remote-btn:active { transform: scale(0.92); background: #52525b; }
        .tv-card { transition: transform 0.15s, border-color 0.15s; cursor: pointer; }
        .tv-card.focused, .tv-card:hover { transform: scale(1.05); border-color: #38bdf8; outline: none; background: #27272a; }
        .watermark {
            position: absolute;
            top: 15px;
            left: 20px;
            font-weight: 900;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center bg-zinc-950 gap-8">

    <!-- ARKA PLAN AMBİYANS -->
    <div class="absolute inset-0 bg-cover bg-center opacity-20 blur-md" style="background-image: url('https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=1920&q=80')"></div>

    <!-- TV EKRANI VE KASASI -->
    <div class="relative z-10 flex flex-col items-center">
        <div class="tv-frame w-[720px] h-[410px] relative flex items-center justify-center">
            <div class="absolute -bottom-2 text-[10px] font-black text-zinc-500 tracking-widest">ZARO TV 4K HDR (FINAL)</div>

            <!-- AKTİF TV İÇERİK EKRANI -->
            <div id="actual-tv-screen" class="tv-screen w-full h-full rounded-md flex flex-col justify-between p-5 text-white relative">
                
                <!-- ZaroTV Canlı Yayın Filigran Logosu -->
                <div id="tv-watermark" class="watermark hidden">
                    <span class="bg-red-600 px-1.5 py-0.5 rounded text-[9px] text-white">CANLI</span> ZARO TV HD
                </div>

                <!-- Üst Bilgi Çubuğu -->
                <div id="tv-top-bar" class="flex justify-between items-center text-xs text-zinc-400 font-bold z-40">
                    <div class="flex items-center gap-2">
                        <span class="text-red-600 font-black text-sm">ZARO TV</span>
                        <span class="text-[9px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300" id="tv-mode-badge">4K HDR</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-[10px] text-sky-400">🌤️ İstanbul 24°C</span>
                        <span id="tv-clock">16:45</span>
                    </div>
                </div>

                <!-- ANA İÇERİK (SMART HUB) -->
                <div id="tv-home" class="flex-1 flex flex-col justify-center space-y-3 my-auto z-40">
                    <div class="text-xs font-bold text-zinc-300">Öne Çıkanlar: Bağlantılar (AV/HDMI), Uydu, Oyunlar ve Sohbet</div>
                    <div class="grid grid-cols-8 gap-2">
                        <div id="card-0" onclick="openTvApp('netflix')" class="tv-card focused bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-solid fa-film text-sm text-red-600"></i>
                            <span class="text-[8px] font-bold">Netflix</span>
                        </div>
                        <div id="card-1" onclick="openTvApp('youtube')" class="tv-card bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-brands fa-youtube text-sm text-red-500"></i>
                            <span class="text-[8px] font-bold">YouTube</span>
                        </div>
                        <div id="card-2" onclick="openTvApp('sources')" class="tv-card bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-solid fa-plug text-sm text-yellow-400"></i>
                            <span class="text-[8px] font-bold">Bağlantılar</span>
                        </div>
                        <div id="card-3" onclick="openTvApp('satellite')" class="tv-card bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-solid fa-satellite-dish text-sm text-amber-500"></i>
                            <span class="text-[8px] font-bold">Uydu</span>
                        </div>
                        <div id="card-4" onclick="openTvApp('games')" class="tv-card bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-solid fa-gamepad text-sm text-purple-500"></i>
                            <span class="text-[8px] font-bold">TV Oyun</span>
                        </div>
                        <div id="card-5" onclick="openTvApp('chat')" class="tv-card bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-solid fa-comments text-sm text-emerald-400"></i>
                            <span class="text-[8px] font-bold">TV Sohbet</span>
                        </div>
                        <div id="card-6" onclick="openTvApp('assistant')" class="tv-card bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-solid fa-robot text-sm text-sky-400"></i>
                            <span class="text-[8px] font-bold">AI Asistan</span>
                        </div>
                        <div id="card-7" onclick="openTvApp('settings')" class="tv-card bg-zinc-900 border-2 border-zinc-700 p-2 rounded-xl flex flex-col items-center justify-center space-y-1">
                            <i class="fa-solid fa-gear text-sm text-zinc-400"></i>
                            <span class="text-[8px] font-bold">Ayarlar</span>
                        </div>
                    </div>
                </div>

                <!-- UYGULAMA GÖRÜNÜM EKRANI -->
                <div id="tv-app-view" class="hidden flex-1 flex flex-col justify-between py-1 z-40">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-1.5">
                        <button onclick="closeTvApp()" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-lg text-[11px] font-bold cursor-pointer"><i class="fa-solid fa-house"></i> Ana Menü</button>
                        <span id="tv-app-title" class="text-xs font-bold text-yellow-400">Uygulama</span>
                        <button onclick="closeTvApp()" class="text-red-400 hover:text-white text-xs cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div id="tv-app-body" class="flex-1 flex flex-col items-center justify-center text-center p-3 text-xs overflow-y-auto"></div>
                </div>

                <!-- Alt Ses Durum Çubuğu -->
                <div id="volume-indicator" class="hidden absolute top-4 right-6 bg-black/80 border border-zinc-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-2 text-yellow-400 z-50">
                    <i class="fa-solid fa-volume-high"></i>
                    <span id="volume-level">Ses: %25</span>
                </div>

            </div>
        </div>
        <!-- TV Ayaklık -->
        <div class="w-40 h-2.5 bg-zinc-800 rounded-b-xl shadow-2xl"></div>
    </div>

    <!-- AKILLI KUMANDA (REMOTE CONTROL) -->
    <div class="remote-controller relative z-10 w-48 p-4 rounded-3xl flex flex-col justify-between text-white space-y-3">
        <!-- Kumanda Üst Kısım -->
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
            <button onclick="toggleTvPower()" class="remote-btn w-8 h-8 rounded-full flex items-center justify-center text-red-400 text-xs" title="Güç (Standby)"><i class="fa-solid fa-power-off"></i></button>
            <span class="text-[9px] font-bold text-zinc-500">ZARO REMOTE</span>
            <button onclick="openTvApp('settings')" class="remote-btn w-8 h-8 rounded-full flex items-center justify-center text-zinc-300 text-xs"><i class="fa-solid fa-gear"></i></button>
        </div>

        <!-- Yön Tuşları ve OK -->
        <div class="flex flex-col items-center space-y-1.5 py-1">
            <button onclick="remoteAction('up')" class="remote-btn w-10 h-8 rounded-xl flex items-center justify-center"><i class="fa-solid fa-chevron-up text-[10px]"></i></button>
            <div class="flex gap-3">
                <button onclick="remoteAction('left')" class="remote-btn w-9 h-8 rounded-xl flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                <button onclick="remoteAction('ok')" class="remote-btn w-10 h-8 rounded-xl flex items-center justify-center bg-sky-600 font-bold text-[10px]">OK</button>
                <button onclick="remoteAction('right')" class="remote-btn w-9 h-8 rounded-xl flex items-center justify-center"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
            </div>
            <button onclick="remoteAction('down')" class="remote-btn w-10 h-8 rounded-xl flex items-center justify-center"><i class="fa-solid fa-chevron-down text-[10px]"></i></button>
        </div>

        <!-- Ses ve Kanal Tuşları -->
        <div class="flex justify-between px-2 text-xs font-bold">
            <div class="flex flex-col gap-1 items-center">
                <span class="text-[8px] text-zinc-400">SES</span>
                <button onclick="adjustVolume(5)" class="remote-btn w-9 h-7 rounded-lg text-xs">+</button>
                <button onclick="adjustVolume(-5)" class="remote-btn w-9 h-7 rounded-lg text-xs">-</button>
            </div>
            <div class="flex flex-col gap-1 items-center">
                <span class="text-[8px] text-zinc-400">KANAL</span>
                <button onclick="changeChannel(1)" class="remote-btn w-9 h-7 rounded-lg text-xs">▲</button>
                <button onclick="changeChannel(-1)" class="remote-btn w-9 h-7 rounded-lg text-xs">▼</button>
            </div>
        </div>

        <!-- Ana Menü ve Geri Tuşları -->
        <div class="flex justify-around pt-1.5 border-t border-zinc-800">
            <button onclick="closeTvApp()" class="remote-btn px-3.5 py-1.5 rounded-xl text-xs font-bold" title="Ana Menü"><i class="fa-solid fa-house"></i></button>
            <button onclick="closeTvApp()" class="remote-btn px-3.5 py-1.5 rounded-xl text-xs font-bold" title="Geri"><i class="fa-solid fa-rotate-left"></i></button>
        </div>
    </div>

    <script>
        let currentVolume = 25;
        let focusedCardIndex = 0;
        let currentActiveApp = null;
        let tvPictureMode = '4K HDR';
        let tvAudioSystem = 'Dolby Atmos';
        let isTvOn = true;

        const channelsList = ["TRT 1 HD", "Show TV", "Star TV", "ATV", "TV8", "TRT Çocuk", "Fox TV / Now", "Kanal D"];
        let currentChannelIndex = 0;
        let snakeDirection = 'RIGHT';
        let isSnakeGameOver = false;
        let snakeIntervalRef = null;

        const friendsList = ["MehmetAliPaşa_Azak", "Luned.tr1", "Y.ali.fx1", "RjKaan3", "uçançocuktrofficial"];
        let tvChatMessages = [
            { sender: "MehmetAliPaşa_Azak", text: "Kanka TV sohbet odasına hoş geldiniz!" },
            { sender: "Luned.tr1", text: "Akşam dizi var mı beyler?" }
        ];

        setInterval(() => {
            const now = new Date();
            document.getElementById('tv-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        function getSmartAiReply(msg) {
            let m = msg.toLowerCase();
            if(m.includes('kınık') || m.includes('haber') || m.includes('durum')) return "Kınık bölgesinde hava gayet sakin kanka, yayınlar sorunsuz sürüyor! 🌟";
            if(m.includes('minecraft') || m.includes('oyun')) return "Kesinlikle girelim kanka, madeni kazmaya hazırım! ⛏️";
            if(m.includes('nasılsın') || m.includes('ne yapıyon')) return "İyidir kanka, ZaroTV SmartOS'ta takılıyoruz, sen napıyon?";
            if(m.includes('saat') || m.includes('ne zaman')) return "Saat 20:00'de herkes online olsun kanka!";
            if(m.includes('selam') || m.includes('merhaba')) return "Aleykümselam kanka, hoş geldin!";
            return `Eyvallah kanka, "${msg}" dedin, ZaroTV asistanı olarak haklısın! 👍`;
        }

        function toggleTvPower() {
            isTvOn = !isTvOn;
            const screen = document.getElementById('actual-tv-screen');
            const topBar = document.getElementById('tv-top-bar');
            const home = document.getElementById('tv-home');
            const appView = document.getElementById('tv-app-view');
            const watermark = document.getElementById('tv-watermark');

            if(!isTvOn) {
                screen.style.background = '#000';
                topBar.style.display = 'none';
                home.style.display = 'none';
                appView.style.display = 'none';
                watermark.style.display = 'none';
            } else {
                screen.style.background = '#000';
                topBar.style.display = 'flex';
                home.style.display = 'flex';
                watermark.style.display = 'none';
            }
        }

        function adjustVolume(amount) {
            if(!isTvOn) return;
            currentVolume = Math.max(0, Math.min(100, currentVolume + amount));
            const ind = document.getElementById('volume-indicator');
            document.getElementById('volume-level').innerText = `Ses: %${currentVolume} (${tvAudioSystem})`;
            ind.classList.remove('hidden');
            setTimeout(() => ind.classList.add('hidden'), 1500);
        }

        function changeChannel(dir) {
            if(!isTvOn) return;
            currentChannelIndex = (currentChannelIndex + dir + channelsList.length) % channelsList.length;
            if(currentActiveApp === 'satellite') {
                playChannelSimulation(currentChannelIndex);
            }
        }

        // Kumanda Yön Tuşları ile Navigasyon ve Yılan Oyunu Kontrolü
        function remoteAction(action) {
            if(!isTvOn) return;
            
            if(currentActiveApp === 'games') {
                if(isSnakeGameOver) {
                    if(action === 'ok' || action === 'up' || action === 'down' || action === 'left' || action === 'right') {
                        initSnakeGame();
                    }
                    return;
                }
                if(action === 'up' && snakeDirection !== 'DOWN') snakeDirection = 'UP';
                if(action === 'down' && snakeDirection !== 'UP') snakeDirection = 'DOWN';
                if(action === 'left' && snakeDirection !== 'RIGHT') snakeDirection = 'LEFT';
                if(action === 'right' && snakeDirection !== 'LEFT') snakeDirection = 'RIGHT';
                return;
            }

            const homeView = document.getElementById('tv-home');
            if(!homeView.classList.contains('hidden')) {
                if(action === 'right') focusedCardIndex = (focusedCardIndex + 1) % 8;
                if(action === 'left') focusedCardIndex = (focusedCardIndex - 1 + 8) % 8;
                
                for(let i=0; i<8; i++) {
                    document.getElementById(`card-${i}`).classList.remove('focused');
                }
                document.getElementById(`card-${focusedCardIndex}`).classList.add('focused');

                if(action === 'ok') {
                    if(focusedCardIndex === 0) openTvApp('netflix');
                    else if(focusedCardIndex === 1) openTvApp('youtube');
                    else if(focusedCardIndex === 2) openTvApp('sources');
                    else if(focusedCardIndex === 3) openTvApp('satellite');
                    else if(focusedCardIndex === 4) openTvApp('games');
                    else if(focusedCardIndex === 5) openTvApp('chat');
                    else if(focusedCardIndex === 6) openTvApp('assistant');
                    else if(focusedCardIndex === 7) openTvApp('settings');
                }
            } else {
                if(action === 'ok' && currentActiveApp === 'netflix') {
                    playVideoSimulation("Stranger Things - Sezon 4 Bölüm 1");
                } else if(action === 'ok' && currentActiveApp === 'youtube') {
                    playVideoSimulation("ZaroOS 17.5 Tanıtım Videosu");
                }
            }
        }

        function playVideoSimulation(videoTitle) {
            const body = document.getElementById('tv-app-body');
            document.getElementById('tv-watermark').classList.remove('hidden');
            body.innerHTML = `
                <div class="w-full h-full bg-black flex flex-col items-center justify-center space-y-3 p-4">
                    <div class="w-full max-w-lg h-44 bg-zinc-900 border border-zinc-700 rounded-2xl flex flex-col items-center justify-center text-center relative shadow-2xl">
                        <div class="absolute top-2 right-3 text-[10px] text-red-500 font-bold">CANLI OYNATILIYOR (${tvPictureMode})</div>
                        <div class="text-3xl text-white mb-2 animate-pulse">▶️</div>
                        <div class="font-bold text-xs text-yellow-300">${videoTitle}</div>
                        <div class="w-full bg-zinc-800 h-1.5 rounded-full absolute bottom-0 overflow-hidden"><div class="bg-red-600 h-full w-[45%]"></div></div>
                    </div>
                    <p class="text-[10px] text-zinc-400">Kumandadan 'Ana Menü' tuşuna basarak dönebilirsiniz.</p>
                </div>`;
        }

        function playChannelSimulation(index) {
            currentChannelIndex = index;
            const body = document.getElementById('tv-app-body');
            document.getElementById('tv-watermark').classList.remove('hidden');
            let chName = channelsList[index];
            body.innerHTML = `
                <div class="w-full h-full bg-zinc-950 flex flex-col items-center justify-center space-y-3 p-4 relative">
                    <div class="absolute top-3 left-4 bg-amber-600 px-2 py-0.5 rounded text-[10px] font-bold text-white">KANAL: ${chName}</div>
                    <div class="w-full max-w-lg h-44 bg-zinc-900 border border-zinc-700 rounded-2xl flex flex-col items-center justify-center text-center relative shadow-2xl">
                        <div class="text-4xl mb-2">📺</div>
                        <div class="font-bold text-sm text-amber-400">${chName} Canlı Yayını</div>
                        <p class="text-[10px] text-zinc-400 mt-1">Yayın Akışı Kesintisiz Sürüyor</p>
                    </div>
                    <p class="text-[10px] text-zinc-400">Kumandadan Kanal ▲▼ tuşlarıyla değiştirebilirsiniz.</p>
                </div>`;
        }

        function playSourceSimulation(sourceName) {
            const body = document.getElementById('tv-app-body');
            document.getElementById('tv-watermark').classList.add('hidden');
            if(sourceName === 'AV (Retro Atari)') {
                body.innerHTML = `
                    <div class="w-full h-full bg-amber-950 flex flex-col items-center justify-center space-y-3 p-4 relative border-4 border-amber-800">
                        <div class="absolute top-2 left-3 bg-red-700 px-2 py-0.5 rounded text-[10px] font-bold text-white">AV KAYNAĞI - RETRO ATARI</div>
                        <div class="w-full max-w-lg h-44 bg-black border-4 border-amber-600 rounded-xl flex flex-col items-center justify-center text-center relative shadow-2xl font-mono">
                            <div class="text-3xl text-yellow-400 mb-1 animate-bounce">🕹️</div>
                            <div class="font-bold text-xs text-green-400">ZARO ATARI 2600 - PİKSEL OYUNU</div>
                            <p class="text-[10px] text-amber-300 mt-1">8-Bit Nostaljik Ekran Aktif</p>
                        </div>
                    </div>`;
            } else if(sourceName === 'HDMI 1 (PlayStation)') {
                body.innerHTML = `
                    <div class="w-full h-full bg-blue-950 flex flex-col items-center justify-center space-y-3 p-4 relative border-4 border-blue-800">
                        <div class="absolute top-2 left-3 bg-blue-600 px-2 py-0.5 rounded text-[10px] font-bold text-white">HDMI 1 - PLAYSTATION 5</div>
                        <div class="w-full max-w-lg h-44 bg-zinc-900 border-4 border-blue-500 rounded-xl flex flex-col items-center justify-center text-center relative shadow-2xl">
                            <div class="text-3xl text-sky-400 mb-1 animate-pulse">🎮</div>
                            <div class="font-bold text-sm text-white">PlayStation 5 Pro - 120 FPS Modu</div>
                            <p class="text-[10px] text-sky-300 mt-1">Konsol sinyali algılandı ve yansıtılıyor.</p>
                        </div>
                    </div>`;
            } else {
                body.innerHTML = `
                    <div class="w-full h-full bg-zinc-900 flex flex-col items-center justify-center space-y-3 p-4">
                        <div class="text-3xl">📡</div>
                        <div class="font-bold text-sm text-white">${sourceName} Bağlantısı</div>
                        <p class="text-[10px] text-zinc-400">Sinyal bekleniyor...</p>
                    </div>`;
            }
        }

        function openTvApp(appId) {
            if(!isTvOn) return;
            currentActiveApp = appId;
            document.getElementById('tv-home').classList.add('hidden');
            const view = document.getElementById('tv-app-view');
            view.classList.remove('hidden');
            const title = document.getElementById('tv-app-title');
            const body = document.getElementById('tv-app-body');

            if(appId === 'netflix') {
                title.innerText = "Netflix Smart TV";
                document.getElementById('tv-watermark').classList.remove('hidden');
                body.innerHTML = `
                    <div class="w-full text-left font-bold text-red-600 mb-2 text-xs">Popüler Filmler ve Diziler (OK tuşu ile izle)</div>
                    <div class="grid grid-cols-3 gap-3 w-full">
                        <div onclick="playVideoSimulation('Stranger Things')" class="bg-zinc-800 p-3 rounded-xl cursor-pointer hover:bg-zinc-700 text-left">🎬 Stranger Things</div>
                        <div onclick="playVideoSimulation('ZaroOS Belgeseli')" class="bg-zinc-800 p-3 rounded-xl cursor-pointer hover:bg-zinc-700 text-left">🎞️ ZaroOS Ekosistemi</div>
                        <div onclick="playVideoSimulation('Cyberpunk Edgerunners')" class="bg-zinc-800 p-3 rounded-xl cursor-pointer hover:bg-zinc-700 text-left">🍿 Cyberpunk Edgerunners</div>
                    </div>`;
            } else if(appId === 'youtube') {
                title.innerText = "YouTube TV";
                document.getElementById('tv-watermark').classList.remove('hidden');
                body.innerHTML = `
                    <div class="w-full text-left font-bold text-red-500 mb-2 text-xs">Trend Videolar (OK tuşu ile izle)</div>
                    <div class="grid grid-cols-2 gap-3 w-full">
                        <div onclick="playVideoSimulation('ZaroOS 17.5 Tanıtım Videosu')" class="bg-zinc-800 p-3 rounded-xl cursor-pointer hover:bg-zinc-700 text-left">▶️ ZaroOS 17.5 Tanıtım Videosu</div>
                        <div onclick="playVideoSimulation('En İyi Roblox Parkur Anları')" class="bg-zinc-800 p-3 rounded-xl cursor-pointer hover:bg-zinc-700 text-left">▶️ En İyi Roblox Parkur Anları</div>
                    </div>`;
            } else if(appId === 'sources') {
                title.innerText = "TV Bağlantıları / Kaynaklar";
                document.getElementById('tv-watermark').classList.add('hidden');
                body.innerHTML = `
                    <div class="w-full text-yellow-400 font-bold text-xs mb-2">Harici Cihaz ve Bağlantı Seçenekleri</div>
                    <div class="grid grid-cols-2 gap-3 w-full">
                        <div onclick="playSourceSimulation('AV (Retro Atari)')" class="bg-zinc-800 p-4 rounded-xl cursor-pointer hover:bg-zinc-700 text-left font-bold">🕹️ AV (Retro Atari Ekranı)</div>
                        <div onclick="playSourceSimulation('HDMI 1 (PlayStation)')" class="bg-zinc-800 p-4 rounded-xl cursor-pointer hover:bg-zinc-700 text-left font-bold">🎮 HDMI 1 (PlayStation 5)</div>
                        <div onclick="playSourceSimulation('HDMI 2 (PC Monitör)')" class="bg-zinc-800 p-4 rounded-xl cursor-pointer hover:bg-zinc-700 text-left font-bold">💻 HDMI 2 (PC Bağlantısı)</div>
                        <div onclick="playSourceSimulation('USB Medya Oynatıcı')" class="bg-zinc-800 p-4 rounded-xl cursor-pointer hover:bg-zinc-700 text-left font-bold">💾 USB Bellek / Medya</div>
                    </div>`;
            } else if(appId === 'satellite') {
                title.innerText = "Uydu / TV Kanalları";
                body.innerHTML = `
                    <div class="w-full text-amber-500 font-bold text-xs mb-2">Ulusal Kanallar (Seçmek için tıkla)</div>
                    <div class="grid grid-cols-3 gap-3 w-full">
                        ${channelsList.map((ch, idx) => `<div onclick="playChannelSimulation(${idx})" class="bg-zinc-800 p-3 rounded-xl cursor-pointer hover:bg-zinc-700 text-left font-bold">📺 ${ch}</div>`).join('')}
                    </div>`;
            } else if(appId === 'games') {
                title.innerText = "ZaroTV Oyun Merkezi - 4K Neon Snake";
                document.getElementById('tv-watermark').classList.add('hidden');
                body.innerHTML = `
                    <div class="flex flex-col items-center justify-center space-y-2 h-full">
                        <div class="text-emerald-400 font-bold text-xs">4K Neon Yılan Oyunu (Yandığında OK tuşuna basıp yeniden başla)</div>
                        <canvas id="snake-canvas" width="260" height="170" class="bg-zinc-950 border-2 border-emerald-500 rounded-xl shadow-2xl"></canvas>
                    </div>`;
                setTimeout(() => initSnakeGame(), 100);
            } else if(appId === 'chat') {
                title.innerText = "ZaroTV Sohbet Odası";
                document.getElementById('tv-watermark').classList.add('hidden');
                let chatHtml = tvChatMessages.map(m => `<div><b>${m.sender}:</b> ${m.text}</div>`).join('');
                body.innerHTML = `
                    <div class="flex flex-col items-center justify-center space-y-2 w-full max-w-md h-full">
                        <div id="tv-chat-log" class="bg-zinc-950 p-3 rounded-2xl w-full h-36 overflow-y-auto text-[11px] text-left space-y-1.5">
                            ${chatHtml}
                        </div>
                        <div class="flex gap-2 w-full">
                            <input type="text" id="tv-chat-input" placeholder="Sohbete yaz..." class="bg-zinc-800 border border-zinc-700 p-2 rounded-xl flex-1 text-xs text-white outline-none" onkeypress="if(event.key==='Enter') sendTvChatMsg()">
                            <button onclick="sendTvChatMsg()" class="bg-emerald-600 px-4 py-2 rounded-xl text-xs font-bold">Gönder</button>
                        </div>
                    </div>`;
            } else if(appId === 'assistant') {
                title.innerText = "Zaro AI TV Asistanı";
                document.getElementById('tv-watermark').classList.add('hidden');
                body.innerHTML = `
                    <div class="flex flex-col items-center justify-center space-y-3 w-full max-w-md h-full">
                        <div class="text-3xl">🤖</div>
                        <div id="ai-chat-log" class="bg-zinc-950 p-3 rounded-2xl w-full h-32 overflow-y-auto text-[11px] text-left space-y-1">
                            <div><b>Zaro AI:</b> Merhaba ZaimTech22! Sana nasıl yardımcı olabilirim? (Örn: Kınık durumu nedir?)</div>
                        </div>
                        <div class="flex gap-2 w-full">
                            <input type="text" id="ai-input" placeholder="Asistana bir şey sor..." class="bg-zinc-800 border border-zinc-700 p-2 rounded-xl flex-1 text-xs text-white outline-none" onkeypress="if(event.key==='Enter') askZaroAI()">
                            <button onclick="askZaroAI()" class="bg-sky-600 px-4 py-2 rounded-xl text-xs font-bold">Sor</button>
                        </div>
                    </div>`;
            } else if(appId === 'settings') {
                title.innerText = "ZaroTV Sistem Ayarları";
                document.getElementById('tv-watermark').classList.add('hidden');
                body.innerHTML = `
                    <div class="space-y-2.5 w-full max-w-sm text-left">
                        <div onclick="togglePictureMode()" class="bg-zinc-800 p-2.5 rounded-xl flex justify-between cursor-pointer hover:bg-zinc-700"><span>Görüntü Modu</span><span id="pic-mode-val" class="text-yellow-400">${tvPictureMode}</span></div>
                        <div onclick="toggleAudioSystem()" class="bg-zinc-800 p-2.5 rounded-xl flex justify-between cursor-pointer hover:bg-zinc-700"><span>Ses Sistemi</span><span id="audio-sys-val" class="text-sky-400">${tvAudioSystem}</span></div>
                        <div class="bg-zinc-800 p-2.5 rounded-xl flex justify-between"><span>Wi-Fi Bağlantısı</span><span class="text-emerald-400">ZaroFiber_5G (Bağlı)</span></div>
                    </div>`;
            }
        }

        function sendTvChatMsg() {
            let input = document.getElementById('tv-chat-input');
            let val = input.value.trim();
            if(!val) return;
            tvChatMessages.push({ sender: "ZaimTech22", text: val });
            const log = document.getElementById('tv-chat-log');
            log.innerHTML += `<div><b>ZaimTech22:</b> ${val}</div>`;
            input.value = '';
            setTimeout(() => {
                let randomFriend = friendsList[Math.floor(Math.random() * friendsList.length)];
                let reply = getSmartAiReply(val);
                tvChatMessages.push({ sender: randomFriend, text: reply });
                log.innerHTML += `<div><b class="text-emerald-400">${randomFriend}:</b> ${reply}</div>`;
                log.scrollTop = log.scrollHeight;
            }, 800);
        }

        // Kararlı 4K Neon Yılan Oyunu (Bug Fix ve Düzgün Yeniden Başlama)
        function initSnakeGame() {
            const canvas = document.getElementById('snake-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            let snake = [{x: 12, y: 8}, {x: 11, y: 8}];
            let food = {x: 6, y: 6};
            snakeDirection = 'RIGHT';
            isSnakeGameOver = false;

            if(snakeIntervalRef) clearInterval(snakeIntervalRef);

            snakeIntervalRef = setInterval(() => {
                if(currentActiveApp !== 'games') return;
                if(isSnakeGameOver) return;

                let dx = 0, dy = 0;
                if(snakeDirection === 'UP') dy = -1;
                if(snakeDirection === 'DOWN') dy = 1;
                if(snakeDirection === 'LEFT') dx = -1;
                if(snakeDirection === 'RIGHT') dx = 1;

                let head = {x: snake[0].x + dx, y: snake[0].y + dy};
                if(head.x < 0 || head.x >= 26 || head.y < 0 || head.y >= 17 || snake.some(s => s.x === head.x && s.y === head.y)) {
                    isSnakeGameOver = true;
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('YANDIN! Tekrar başlamak için', canvas.width/2, canvas.height/2 - 10);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillText('OK tuşuna basın', canvas.width/2, canvas.height/2 + 10);
                    return;
                }
                snake.unshift(head);
                if(head.x === food.x && head.y === food.y) {
                    food = {x: Math.floor(Math.random()*26), y: Math.floor(Math.random()*17)};
                } else {
                    snake.pop();
                }

                ctx.fillStyle = '#050508';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f43f5e';
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(food.x*10+1, food.y*10+1, 8, 8);

                ctx.shadowColor = '#10b981';
                ctx.fillStyle = '#10b981';
                snake.forEach(s => {
                    ctx.fillRect(s.x*10+1, s.y*10+1, 8, 8);
                });
                ctx.shadowBlur = 0;
            }, 110);
        }

        function askZaroAI() {
            let input = document.getElementById('ai-input');
            let val = input.value.trim();
            if(!val) return;
            const log = document.getElementById('ai-chat-log');
            log.innerHTML += `<div><b>ZaimTech22:</b> ${val}</div>`;
            input.value = '';
            setTimeout(() => {
                let reply = getSmartAiReply(val);
                log.innerHTML += `<div><b class="text-sky-400">Zaro AI:</b> ${reply}</div>`;
                log.scrollTop = log.scrollHeight;
            }, 800);
        }

        function togglePictureMode() {
            const screen = document.getElementById('actual-tv-screen');
            if(tvPictureMode === '4K HDR') {
                tvPictureMode = 'Sinema Modu';
                screen.style.filter = 'sepia(0.2) contrast(1.1)';
            } else if(tvPictureMode === 'Sinema Modu') {
                tvPictureMode = 'Dinamik';
                screen.style.filter = 'saturate(1.5) contrast(1.2)';
            } else {
                tvPictureMode = '4K HDR';
                screen.style.filter = 'none';
            }
            document.getElementById('pic-mode-val').innerText = tvPictureMode;
            document.getElementById('tv-mode-badge').innerText = tvPictureMode;
        }

        function toggleAudioSystem() {
            if(tvAudioSystem === 'Dolby Atmos') tvAudioSystem = 'DTS:X Surround';
            else if(tvAudioSystem === 'DTS:X Surround') tvAudioSystem = 'Standart';
            else tvAudioSystem = 'Dolby Atmos';
            document.getElementById('audio-sys-val').innerText = tvAudioSystem;
        }

        function closeTvApp() {
            currentActiveApp = null;
            if(snakeIntervalRef) clearInterval(snakeIntervalRef);
            document.getElementById('tv-app-view').classList.add('hidden');
            document.getElementById('tv-home').classList.remove('hidden');
            document.getElementById('tv-watermark').classList.add('hidden');
        }
    </script>
</body>
</html>
